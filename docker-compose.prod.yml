version: '3.9'
services:
  app:
    image: ghcr.io/gold-fish-talents/gold-fish-talents:latest
    env_file:
      - .env
    volumes:
      - gold-fish-talents_data:/app/.data
      - gold-fish-talents_static:/app/static
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - typesense
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3

  typesense:
    image: typesense/typesense:29.0
    command: --data-dir /data
    env_file:
      - .env
    volumes:
      - gold-fish-talents_search-data:/data
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 6<>/dev/tcp/localhost/8108 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3

volumes:
  gold-fish-talents_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/gold-fish-talents/.data
  gold-fish-talents_static:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/gold-fish-talents/static
  gold-fish-talents_search-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/gold-fish-talents/.data

networks:
  internal:
    driver: overlay
