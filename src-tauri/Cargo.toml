[package]
name = "gold-fish-talents"
description = "E2E platform empowering brands to discover, manage, and collaborate with creative talents"
authors = ["Shirsendu Bairagi <shirsendu2001@gmail.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/Gold-Fish-Talents/gold-fish-talents.git"
edition = "2024"
rust-version = "1.98.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12", features = [] }
tauri-plugin-log = "2.10"
